<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="https://cdn.jsdelivr.net/gh/web-ports/cuphead@c9ff1b6b16f9d402b78a42fc2200e1c076c0ab6e/">
  <title>Cuphead</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080808; color: #eee; font: 14px Arial, sans-serif; }
    #gameContainer { width: 100vw; height: 100vh; }
    #gameContainer canvas { width: 100% !important; height: 100% !important; }
    #loading {
      position: fixed; inset: 0; z-index: 10; display: grid; place-content: center;
      gap: 14px; padding: 24px; background: #080808; text-align: center;
    }
    #loading h1 { margin: 0; font-size: 24px; letter-spacing: 2px; }
    #status { color: #bbb; }
    .track { width: min( min(78vw, 420px), 420px ); height: 8px; overflow: hidden; border-radius: 20px; background: #292929; }
    #bar { width: 0%; height: 100%; background: #eee; transition: width .12s linear; }
    #detail { color: #888; font-size: 12px; }
    #error { display: none; max-width: 560px; color: #ff8585; line-height: 1.5; overflow-wrap: anywhere; }
    #retry { display: none; justify-self: center; padding: 9px 16px; border: 0; border-radius: 5px; background: #eee; color: #111; cursor: pointer; }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <h1>CUPHEAD</h1>
    <div id="status">Preparing game files…</div>
    <div class="track"><div id="bar"></div></div>
    <div id="detail">Starting downloads</div>
    <div id="error"></div>
    <button id="retry" type="button" onclick="location.reload()">Try again</button>
  </div>
  <div id="gameContainer"></div>

  <script>
  (() => {
    "use strict";

    const loading = document.getElementById("loading");
    const status = document.getElementById("status");
    const detail = document.getElementById("detail");
    const bar = document.getElementById("bar");
    const errorBox = document.getElementById("error");
    const retry = document.getElementById("retry");

    const CACHE_NAME = "cuphead-assets-v3";
    const PARALLEL_DOWNLOADS = 8;

    // Sources are tried in order: jsDelivr, GitHub Raw, then the GitHub API.
    const CDN_ROOT =
      "https://cdn.jsdelivr.net/gh/web-ports/cuphead@c9ff1b6b16f9d402b78a42fc2200e1c076c0ab6e/";
    const RAW_ROOT =
      "https://raw.githubusercontent.com/AMoldyWaffle/Cuphead/main/";
    const API_ROOT =
      "https://api.github.com/repos/AMoldyWaffle/Cuphead/contents/";

    // Unique token for this page load. This asks browsers/CDNs for a fresh URL.
    const CACHE_BUSTER = "fresh=" + Date.now() + "-" +
      Math.random().toString(36).slice(2);

    function withCacheBuster(url) {
      return url + (url.includes("?") ? "&" : "?") + CACHE_BUSTER;
    }

    const assets = [
      { name: "CupheadPort.data.unityweb", count: 103 },
      { name: "CupheadPort.wasm.code.unityweb", count: 2 },
      { name: "CupheadPort.asm.code.unityweb", count: 3 }
    ];

    function showError(error) {
      status.textContent = "The game could not be loaded.";
      detail.textContent = "";
      bar.style.background = "#e45b5b";
      errorBox.style.display = "block";
      errorBox.textContent = error && error.message ? error.message : String(error);
      retry.style.display = "inline-block";
    }

    function sourceUrls(path) {
      const safePath = path.split("/").map(encodeURIComponent).join("/");
      return [
        withCacheBuster(CDN_ROOT + path),
        withCacheBuster(RAW_ROOT + safePath),
        withCacheBuster(API_ROOT + safePath + "?ref=main")
      ];
    }

    async function fetchWithFallback(path, options = {}) {
      const urls = sourceUrls(path);
      const failures = [];

      for (let i = 0; i < urls.length; i++) {
        try {
          const headers = { ...(options.headers || {}) };
          if (i === 2) {
            headers.Accept = "application/vnd.github.raw+json";
          }

          const response = await fetch(urls[i], {
            ...options,
            headers,
            cache: "no-store"
          });

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          return response;
        } catch (error) {
          failures.push(urls[i] + " — " + (error.message || error));
        }
      }

      throw new Error(
        "All download sources failed for " + path + ". " + failures.join(" | ")
      );
    }

    function loadScriptWithFallback(path) {
      return new Promise((resolve, reject) => {
        const urls = sourceUrls(path);
        let index = 0;
        const errors = [];

        function attempt() {
          if (index >= urls.length) {
            reject(new Error(
              "UnityLoader.js could not be loaded from any source. " +
              errors.join(" | ")
            ));
            return;
          }

          const script = document.createElement("script");
          script.src = urls[index++];
          script.onload = () => resolve();
          script.onerror = () => {
            errors.push(script.src);
            script.remove();
            attempt();
          };
          document.head.appendChild(script);
        }

        attempt();
      });
    }

    function partUrl(name, number) {
      return "Build/" + name + ".part" + number;
    }

    async function downloadPart(cache, path, progress) {
      const cacheKey = new Request(new URL(path, CDN_ROOT).href);
      const response = await fetchWithFallback(path);
      const blob = await response.blob();
      progress(Number(response.headers.get("content-length")) || blob.size);

      // Store under a stable key so a part downloaded from any mirror can be reused.
      try {
        await cache.put(cacheKey, new Response(blob));
      } catch (_) {}

      return blob;
    }

    async function runPool(tasks, workerCount, worker) {
      const results = new Array(tasks.length);
      let next = 0;

      async function runner() {
        while (true) {
          const index = next++;
          if (index >= tasks.length) return;
          results[index] = await worker(tasks[index], index);
        }
      }

      await Promise.all(
        Array.from({ length: Math.min(workerCount, tasks.length) }, runner)
      );
      return results;
    }

    async function load() {
      try {
        status.textContent = "Loading game engine…";
        detail.textContent = "Trying available sources";
        await loadScriptWithFallback("Build/UnityLoader.js");

        if (!window.UnityLoader || typeof UnityLoader.instantiate !== "function") {
          throw new Error("UnityLoader.js loaded, but UnityLoader.instantiate is unavailable.");
        }

        // Clear this launcher's saved Cache Storage entries before downloading.
        // This does not purge a shared CDN's edge cache; unique URLs above request fresh copies.
        try {
          await caches.delete(CACHE_NAME);
        } catch (_) {}

        const cache = await caches.open(CACHE_NAME);
        const totalParts = assets.reduce((sum, asset) => sum + asset.count, 0);
        let completedParts = 0;

        function updateProgress(assetName) {
          completedParts++;
          const percent = Math.round(completedParts / totalParts * 100);
          bar.style.width = percent + "%";
          status.textContent = "Downloading game files… " + percent + "%";
          detail.textContent = completedParts + " / " + totalParts + " parts · " + assetName;
        }

        // Process one large asset at a time to reduce peak memory use.
        for (const asset of assets) {
          const mergedKey = "merged/" + asset.name;

          const tasks = Array.from({ length: asset.count }, (_, index) => ({
            path: partUrl(asset.name, index + 1),
            order: index
          }));

          const parts = await runPool(tasks, PARALLEL_DOWNLOADS, async task => {
            const blob = await downloadPart(
              cache,
              task.path,
              () => updateProgress(asset.name)
            );
            return { order: task.order, blob };
          });

          parts.sort((a, b) => a.order - b.order);
          asset.blob = new Blob(parts.map(part => part.blob));

          try {
            await cache.put(mergedKey, new Response(asset.blob));
          } catch (_) {}

          parts.length = 0;
        }

        const objectUrls = {};
        for (const asset of assets) {
          objectUrls[asset.name] = URL.createObjectURL(asset.blob);
        }

        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url, ...rest) {
          const text = String(url);
          for (const asset of assets) {
            if (text.includes(asset.name)) {
              url = objectUrls[asset.name];
              break;
            }
          }
          return originalOpen.call(this, method, url, ...rest);
        };

        status.textContent = "Loading game configuration…";
        detail.textContent = "Trying available sources";

        // The Unity configuration file also gets the same CDN → Raw → API fallback.
        const configResponse = await fetchWithFallback("Build/CupheadPort.json");
        const configText = await configResponse.text();
        if (!configText || !configText.trim().startsWith("{")) {
          throw new Error("CupheadPort.json was not valid JSON.");
        }

        const configUrl = URL.createObjectURL(
          new Blob([configText], { type: "application/json" })
        );

        status.textContent = "Starting Cuphead…";
        detail.textContent = "Files ready";
        bar.style.width = "100%";
        UnityLoader.instantiate("gameContainer", configUrl);
        loading.style.display = "none";
      } catch (error) {
        console.error("Cuphead loading error:", error);
        showError(error);
      }
    }

    load();
  })();
  </script>
</body>
</html>
